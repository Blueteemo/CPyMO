name: CPyMO 1.2 audited desktop UI maintenance asset sync
on:
  push:
    branches:
      - fix/nds-v1.2-pico-acceptance-20261027
    paths:
      - .github/workflows/nds-v12-postrelease-desktop-refresh.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: cpymo-nds-v12-maintenance-asset-sync
  cancel-in-progress: false
jobs:
  audited-release-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Protect initial release tag, assets and audit source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40621518621" > audited-run.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/nds-v1.2.0" > release-before.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nds-v1.2.0" > tag-before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path("audited-run.json").read_text())
          release=json.loads(Path("release-before.json").read_text())
          tag=json.loads(Path("tag-before.json").read_text())
          assert run["id"]==40621518621 and run["head_sha"]=="3a78ec8f8dcc29edaac58751dbdc2bde67255f0a"
          assert run["status"]=="completed" and run["conclusion"]=="success",run
          assert release["tag_name"]=="nds-v1.2.0" and not release["draft"] and not release["immutable"]
          assert tag["object"]["sha"]=="0d1bc7a702e552e49735838a7a7eacae8ca40aeb"
          old={
          "CPyMO-for-NDS-1.2.0-Starter-Windows.zip":"8e85611033cf89fa12cb89c3727a397b98db083fb12cb29a5f818eef6a35d581",
          "CPyMO-for-NDS-1.2.0-Starter-macOS-arm64.zip":"975500238bb0050e0da92bdbc6d41f37e30098f0861bc8d9c015fde8298df7db",
          "CPyMO-for-NDS-1.2.0-Sources.zip":"67fb74c8a0a8b2b6b87aa60709fb65dfbdc0644f7744b39c58e28c9d5ef55760",
          "CPyMO-for-NDS-1.2.0-SHA256SUMS.txt":"5939ef5217bf3ea918edd9033013ccd0968aeea80cd03adaadc091a202ef5d7c",
          "cpymo-nds.nds":"7759a5db97d744aa3e3014e24550cd6b23d0c758735c60cfd835f0b92e51ae31"}
          actual={x["name"]:x["digest"].removeprefix("sha256:") for x in release["assets"]}
          assert actual==old,(actual,old)
          print("Audited source, fixed original release and tag: MATCH; no upload yet.")
          PY
      - name: Download the single successful cross-platform audit and packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download 40621518621 --repo "$GITHUB_REPOSITORY" --dir .paired-download
      - name: Independently verify audited packages and prepare exact release names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          root=Path(".paired-download")
          audit=json.loads((root/"CPyMO-1.2-PAIRED-STAGING-AUDIT-SHA256SUMS"/"RC-PAIRED-AUDIT.json").read_text())
          assert audit["source_commit"]=="3a78ec8f8dcc29edaac58751dbdc2bde67255f0a"
          assert audit["workflow_run"]=="40621518621"
          romsha="7759a5db97d744aa3e3014e24550cd6b23d0c758735c60cfd835f0b92e51ae31"
          assert audit["rom_sha256"]==romsha
          srcs={
           "rom":root/"CPyMO-1.2-UNIVERSAL-VERIFIED-ROM-RC"/"cpymo-nds.nds",
           "windows":root/"CPyMO-1.2-WINDOWS-PAIRED-ROM-RC-NOT-RELEASE"/"CPyMO-for-NDS-1.2.0-Starter-Windows-RC.zip",
           "macos":root/"CPyMO-1.2-macOS-arm64-PAIRED-ROM-RC-LOCAL-DEEPSEEK-REVIEW"/"CPyMO-for-NDS-1.2.0-Starter-macOS-arm64-RC.zip",
           "sources":root/"CPyMO-1.2-SOURCES-RC-LICENSE-REVIEW"/"CPyMO-for-NDS-1.2.0-Sources-RC.zip"}
          destnames={
           "rom":"cpymo-nds.nds",
           "windows":"CPyMO-for-NDS-1.2.0-Starter-Windows.zip",
           "macos":"CPyMO-for-NDS-1.2.0-Starter-macOS-arm64.zip",
           "sources":"CPyMO-for-NDS-1.2.0-Sources.zip"}
          out=Path("release-public");out.mkdir()
          sums=[];summary={}
          for kind,p in srcs.items():
           assert p.is_file(),str(p)
           h=hashlib.sha256(p.read_bytes()).hexdigest();n=p.stat().st_size
           assert h==audit["distributions"][kind]["sha256"] and n==audit["distributions"][kind]["bytes"],kind
           if kind=="rom":assert h==romsha and n==924672
           else:
            with zipfile.ZipFile(p) as z:
             assert z.testzip() is None
             if kind=="sources":
              apppaths=[x for x in z.namelist() if x.endswith("/cpymo-tool/nds-converter/app.py")]
              assert len(apppaths)==1
              code=z.read(apppaths[0]).decode("utf-8")
              assert "self.progress.pack(fill='x',before=self.status_label)" in code
              assert "self.progress.pack_forget()" in code
           shutil.copy2(p,out/destnames[kind])
           summary[kind]={"name":destnames[kind],"sha256":h,"bytes":n}
           sums.append(h+"  "+destnames[kind]+"\n")
          checksums=out/"CPyMO-for-NDS-1.2.0-SHA256SUMS.txt"
          checksums.write_text("".join(sums),encoding="ascii")
          summary["checksums"]={"name":checksums.name,"sha256":hashlib.sha256(checksums.read_bytes()).hexdigest(),"bytes":checksums.stat().st_size}
          Path("maintenance-result.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          release=json.loads(Path("release-before.json").read_text())
          body=release["body"]
          old={"windows":"8e85611033cf89fa12cb89c3727a397b98db083fb12cb29a5f818eef6a35d581",
               "macos":"975500238bb0050e0da92bdbc6d41f37e30098f0861bc8d9c015fde8298df7db",
               "sources":"67fb74c8a0a8b2b6b87aa60709fb65dfbdc0644f7744b39c58e28c9d5ef55760"}
          for kind,prev in old.items():
           assert prev in body,("Release notes changed unexpectedly",kind)
           body=body.replace(prev,summary[kind]["sha256"])
          body+="\n\n---\n\n### 2026-10-28 · 桌面转换器小幅界面修补\n\n"
          body+="本次维护使进度条只在识别或转换任务执行时显示，空闲时不再残留左侧活动块；同时优化游戏版本列表的高度与滚动条，以及视频选项的窗口自适应宽度。转换算法、版本号和 NDS/DSi 程序均未改变。\n\n"
          body+="Windows / macOS ARM64 与配套源码来自维护提交 3a78ec8f8dcc29edaac58751dbdc2bde67255f0a，通过自动化回归、双平台安装包构建和跨资产审计（GitHub Actions run 40621518621）。"
          body+="原始发行标签 nds-v1.2.0 仍指向 2026-10-27 的首发提交，桌面安装包使用上述后续修补源码；两者来源均如实保留。\n\n"
          body+="本次保留原始 cpymo-nds.nds：924672 字节，SHA-256 为 "+romsha+"。最新下载哈希以当前 SHA256SUMS.txt 为准。\n"
          Path("release-updated.md").write_text(body,encoding="utf-8")
          print("Verified 5 release files from one audited run and rendered new checksums:",json.dumps(summary,indent=2))
          PY
      - name: Back up every original asset to permit rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-backup
          gh release download nds-v1.2.0 --repo "$GITHUB_REPOSITORY" --dir .release-backup --pattern 'CPyMO-for-NDS-1.2.0-*'
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          initial=json.loads(Path("release-before.json").read_text())
          for asset in initial["assets"]:
           if asset["name"]=="cpymo-nds.nds":continue
           p=Path(".release-backup")/asset["name"]
           assert p.exists(),p
           actual="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest()
           assert actual==asset["digest"],(asset["name"],actual,asset["digest"])
          print("Original published assets safely backed up with matching digests.")
          PY
      - name: Replace only verified desktop/source/checksum assets and verify final publication
        shell: bash
        run: |
          set -Eeuo pipefail
          rollback() {
            echo 'Release update failed; restoring all four original release attachments and notes.'
            gh release upload nds-v1.2.0 .release-backup/CPyMO-for-NDS-1.2.0-Starter-Windows.zip .release-backup/CPyMO-for-NDS-1.2.0-Starter-macOS-arm64.zip .release-backup/CPyMO-for-NDS-1.2.0-Sources.zip .release-backup/CPyMO-for-NDS-1.2.0-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber || true
            gh release edit nds-v1.2.0 --repo "$GITHUB_REPOSITORY" --notes-file .release-backup/original-notes.md || true
          }
          gh release view nds-v1.2.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > .release-backup/original-notes.md
          trap rollback ERR
          gh release upload nds-v1.2.0 release-public/CPyMO-for-NDS-1.2.0-Starter-Windows.zip release-public/CPyMO-for-NDS-1.2.0-Starter-macOS-arm64.zip release-public/CPyMO-for-NDS-1.2.0-Sources.zip release-public/CPyMO-for-NDS-1.2.0-SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit nds-v1.2.0 --repo "$GITHUB_REPOSITORY" --notes-file release-updated.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/nds-v1.2.0" > release-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          new=json.loads(Path("maintenance-result.json").read_text())
          old=json.loads(Path("release-before.json").read_text())
          cur=json.loads(Path("release-after.json").read_text())
          assert cur["tag_name"]==old["tag_name"]=="nds-v1.2.0"
          assert cur["target_commitish"]==old["target_commitish"]
          before={a["name"]:a for a in old["assets"]}
          after={a["name"]:a for a in cur["assets"]}
          assert set(before)==set(after),("Unexpected release assets",set(before),set(after))
          for kind,item in new.items():
           actual=after[item["name"]]
           assert actual["digest"]=="sha256:"+item["sha256"],(kind,actual["digest"],item["sha256"])
           assert actual["size"]==item["bytes"],(kind,actual["size"],item["bytes"])
          assert after["cpymo-nds.nds"]["id"]==before["cpymo-nds.nds"]["id"],"ROM asset was replaced, forbidden"
          print("All five published assets verified; original ROM asset remains untouched.")
          PY
          trap - ERR
      - name: Keep audited hashes and prior-release snapshot in job evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-MAINTENANCE-VERIFIED-RELEASE-HASHES
          path: |
            maintenance-result.json
            release-before.json
            release-after.json
            release-updated.md
          retention-days: 90
          if-no-files-found: error
