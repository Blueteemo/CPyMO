name: CPyMO 1.2 Converter Defaults and macOS Development Candidate
on:
  workflow_dispatch:
  push:
    branches:
      - fix/nds-v1.2-pico-acceptance-20261027
    paths:
      - cpymo-tool/nds-converter/**
      - .github/workflows/nds-v12-converter-macos-candidate.yml
permissions:
  contents: read

jobs:
  converter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r cpymo-tool/nds-converter/requirements.txt
      - name: Setup video-capable FFmpeg
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg
          out=Path(os.environ['RUNNER_TEMP'])/'ffmpeg'
          out.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(out.parent)+'\n')
          PY
      - name: Full converter regression, including defaults and glyph fallback
        run: python -m unittest discover -s cpymo-tool/nds-converter/tests -v

  candidate-rom:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build DSi-compatible ROM for INTERNAL macOS packaging test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init stb endianness.h
          python3 cpymo-backends/nds/build.py --dsi-experiment
          cp cpymo-backends/nds/cpymo-dsi-experiment.nds cpymo-nds.nds
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: Internal-Converter-Candidate-ROM-NOT-RELEASE
          path: cpymo-nds.nds
          retention-days: 7
          if-no-files-found: error

  macos-app:
    needs: [candidate-rom,converter-regression]
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Internal-Converter-Candidate-ROM-NOT-RELEASE
          path: .internal-rom
      - name: Install frozen macOS build dependencies and complete FFmpeg
        run: |
          python -m pip install -r cpymo-tool/nds-converter/requirements-build.txt imageio-ffmpeg==0.6.0
          python -c "import tkinter; print('Tk',tkinter.TkVersion)"
      - name: Resolve FFmpeg binary
        run: |
          python - <<'PY'
          import os, pathlib, imageio_ffmpeg
          path=pathlib.Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert path.is_file()
          with open(os.environ['GITHUB_ENV'],'a') as o:o.write('MACOS_FFMPEG='+str(path)+'\n')
          PY
      - name: Build unsigned macOS app as an INTERNAL candidate
        run: |
          python cpymo-tool/nds-converter/build_portable_macos.py --ffmpeg "$MACOS_FFMPEG" --rom .internal-rom/cpymo-nds.nds --output macos-dev
      - name: Smoke actual frozen app using synthetic PyMO and MP4
        run: |
          python cpymo-tool/nds-converter/tests/smoke_macos_portable.py --ffmpeg "$MACOS_FFMPEG" --portable macos-dev
      - name: Keep separate research package; NOT a public release
        run: |
          mkdir -p macos-package/CPyMO-macOS-REVIEW-NOT-RELEASE
          ditto macos-dev/CPyMO-NDS-Converter.app macos-package/CPyMO-macOS-REVIEW-NOT-RELEASE/CPyMO-NDS-Converter.app
          cp macos-dev/cpymo-nds.nds macos-dev/VERSION.json macos-dev/README-macOS.txt macos-package/CPyMO-macOS-REVIEW-NOT-RELEASE/
          cd macos-package && ditto -c -k --sequesterRsrc --keepParent CPyMO-macOS-REVIEW-NOT-RELEASE ../CPyMO-macOS-REVIEW-NOT-RELEASE.zip
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-macOS-GUI-CANDIDATE-NOT-RELEASE
          path: CPyMO-macOS-REVIEW-NOT-RELEASE.zip
          retention-days: 7
          if-no-files-found: error
