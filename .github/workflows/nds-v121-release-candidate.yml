name: CPyMO 1.3.0 Universal ROM and Paired Desktop Release
on:
  workflow_dispatch:
  push:
    branches:
      - codex/nds-v1.2.1-release-candidate
    paths:
      - .github/workflows/nds-v121-release-candidate.yml
      - .github/ci-requests/nds-121-rc.txt
permissions:
  contents: read

jobs:
  final-rom:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build the SINGLE universal NTR/TWL ROM from checked-out source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init stb endianness.h
          test -f cpymo-backends/nds/assets/nds-dual-bg.rgb555
          python3 cpymo-backends/nds/tools/verify_nds_icons.py
          python3 cpymo-backends/nds/tools/generate-ui-font.py
          python3 cpymo-backends/nds/build.py --dsi-experiment
      - name: Embed approved 02-B and forbid placeholder release
        run: |
          python3 cpymo-backends/nds/tools/patch-rom-bg.py \
            --rom cpymo-backends/nds/cpymo-dsi-experiment.nds \
            --art cpymo-backends/nds/assets/nds-dual-bg.rgb555 \
            --output release-rom/cpymo-nds.nds
          python3 cpymo-backends/nds/tools/verify-release-artifact.py \
            --rom release-rom/cpymo-nds.nds --report release-rom/ROM-VERIFICATION.json
          python3 cpymo-backends/nds/tools/verify_nds_icons.py \
            --rom release-rom/cpymo-nds.nds --report release-rom/ICON-VERIFICATION.json
          sha256sum release-rom/cpymo-nds.nds
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.3.0-UNIVERSAL-VERIFIED-ROM
          path: release-rom/
          retention-days: 21
          if-no-files-found: error

  converter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install conversion tools
        run: |
          python -m pip install -r cpymo-tool/nds-converter/requirements.txt
          python -m pip install imageio-ffmpeg==0.6.0
          python - <<'PY'
          import os,pathlib,imageio_ffmpeg
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ffmpeg'
          p.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(p.parent)+'\n')
          PY
      - name: Generate multilingual UI font; all host regression tests
        run: |
          python cpymo-backends/nds/tools/generate-ui-font.py
          python -m unittest discover -s cpymo-tool/nds-converter/tests -v
          python cpymo-tool/nds-converter/tools/build_desktop_icons.py --source cpymo-tool/nds-converter/assets/converter-icon-source.png --output /tmp/verified-desktop-icons
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/verified-desktop-icons/icon-manifest.json').read_text())
          assert data['source_sha256']=='133abae11b6d958c8e02d70e67dcf997049b5277bde3c734860e19f80257d90e'
          assert data['artwork_id']=='approved-pymo-original-rounded-2026'
          assert data['reapplied_crop_or_mask'] is False
          assert all(x['bytes']>100 for x in data['outputs'].values())
          print('Approved rounded original PNG and desktop icon assets: PASS')
          PY

  windows-rc:
    needs: [final-rom,converter-regression,macos-rc]
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: CPyMO-1.3.0-UNIVERSAL-VERIFIED-ROM
          path: .release-rom
      - name: Install pinned converter dependencies
        run: python -m pip install -r cpymo-tool/nds-converter/requirements-build.txt
      - name: Download paired macOS package for its verified original FFmpeg source
        uses: actions/download-artifact@v4
        with:
          name: CPyMO-1.3.0-macOS-arm64-PAIRED-ROM
          path: .paired-ffmpeg-source
      - name: Extract only the approved FFmpeg source archive from the paired package
        shell: pwsh
        run: |
          @'
          import hashlib
          from pathlib import Path
          import zipfile
          root = Path('.paired-ffmpeg-source')
          with zipfile.ZipFile(root / 'CPyMO-for-NDS-1.3.0-Starter-macOS-arm64.zip') as z:
              matches = [name for name in z.namelist() if name.endswith('/FFmpeg-Corresponding-Source/ffmpeg-7.1.5.tar.xz')]
              assert len(matches) == 1, matches
              source = z.read(matches[0])
          assert hashlib.sha256(source).hexdigest() == 'de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f'
          (root / 'ffmpeg-7.1.5.tar.xz').write_bytes(source)
          print('Paired original FFmpeg source: SHA-256 verified; Windows binary will be compiled natively')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Paired FFmpeg source identity failed' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            diffutils
            pkgconf
            curl
            tar
            xz
      - name: Compile self-contained LGPL-only FFmpeg from matched Windows source
        shell: msys2 {0}
        env:
          FFMPEG_SOURCE_ARCHIVE: .paired-ffmpeg-source/ffmpeg-7.1.5.tar.xz
        run: |
          bash cpymo-tool/nds-converter/tools/build_ffmpeg_windows_lgpl.sh windows-ffmpeg-lgpl
      - name: Verify Windows build and select paired FFmpeg
        shell: pwsh
        run: |
          $ff = (Resolve-Path "windows-ffmpeg-lgpl/bin/ffmpeg.exe").Path
          & $ff -version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone LGPL FFmpeg cannot run on Windows runner' }
          $config = Get-Content -Raw "windows-ffmpeg-lgpl/source/FFMPEG-BUILDCONF.txt"
          if ($config.Contains("--enable-nonfree") -or $config.Contains("--enable-gpl")) { throw 'Rejected nonredistributable/GPL flags' }
          "NDS_FFMPEG=$ff" >> $env:GITHUB_ENV
      - name: Verify final ROM before and after packaging
        shell: pwsh
        run: |
          python cpymo-backends/nds/tools/verify-release-artifact.py --rom .release-rom/cpymo-nds.nds
          if ($LASTEXITCODE -ne 0) { throw 'Verified ROM gate failed' }
          python cpymo-tool/nds-converter/build_portable.py --rom .release-rom/cpymo-nds.nds --ffmpeg "$env:NDS_FFMPEG" --output windows-rc --require-desktop-icon
          if ($LASTEXITCODE -ne 0) { throw 'Windows frozen package build failed' }
          python cpymo-tool/nds-converter/tests/smoke_windows_portable.py --portable windows-rc --ffmpeg "$env:NDS_FFMPEG"
          if ($LASTEXITCODE -ne 0) { throw 'Windows synthetic video conversion failed' }
      - name: Assemble user-facing Windows distribution without copyrighted game content
        shell: pwsh
        run: |
          $folder = 'out/CPyMO-for-NDS-1.3.0-Starter-Windows'
          New-Item -ItemType Directory -Force -Path "$folder/Converter", "$folder/pymo/games" | Out-Null
          Copy-Item -Recurse 'windows-rc/app/Converter/*' "$folder/Converter/"
          Copy-Item windows-rc/cpymo-nds.nds "$folder/cpymo-nds.nds"
          Copy-Item cpymo-tool/nds-converter/README.md "$folder/转换器说明.md"
          Copy-Item cpymo-tool/nds-converter/assets/ICON-ATTRIBUTION.txt "$folder/图标来源与署名.txt"
          Copy-Item cpymo-tool/nds-converter/assets/PYMO-ORIGINAL-MIT-LICENSE.txt "$folder/PYMO-ORIGINAL-MIT-LICENSE.txt"
          Copy-Item windows-rc/VERSION.json "$folder/VERSION.json"
          Copy-Item windows-rc/ICON-MANIFEST.json "$folder/ICON-MANIFEST.json"
          New-Item -ItemType Directory -Force -Path "$folder/FFmpeg-Corresponding-Source" | Out-Null
          Copy-Item windows-ffmpeg-lgpl/source/* "$folder/FFmpeg-Corresponding-Source/"
          Set-Content -Path "$folder/启动转换器.bat" -Value '@echo off' -Encoding ascii
          Add-Content -Path "$folder/启动转换器.bat" -Value 'start "" "%~dp0Converter\Converter.exe"' -Encoding ascii
          @'
          CPyMO for NDS 1.3.0
          Companion game-data converter for Nintendo DS / DSi.
          Corresponding FFmpeg source, build configuration and third-party
          licenses are included. Keep them with redistributed binaries.
          Back up old save folders and do not overwrite personal game files.
          '@ | Set-Content -Path "$folder/安装须知.txt" -Encoding UTF8
          Compress-Archive -Path "$folder" -DestinationPath CPyMO-for-NDS-1.3.0-Starter-Windows.zip
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Windows zip stage failed" }
          python cpymo-backends/nds/tools/verify-release-artifact.py --rom .release-rom/cpymo-nds.nds --windows-starter CPyMO-for-NDS-1.3.0-Starter-Windows.zip
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.3.0-WINDOWS-PAIRED-ROM
          path: |
            CPyMO-for-NDS-1.3.0-Starter-Windows.zip
            windows-rc/native-validation/result.json
            windows-rc/native-validation/window.png
          retention-days: 21
          if-no-files-found: error

  macos-rc:
    needs: [final-rom,converter-regression]
    # Public release targets native Apple Silicon only, no Rosetta.
    # Intel macOS users can use the source converter on supported Python.
    runs-on: macos-15
    env:
      CPYMO_MAC_ARCH: arm64
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: CPyMO-1.3.0-UNIVERSAL-VERIFIED-ROM
          path: .release-rom
      - name: Build and verify LGPL-only FFmpeg from corresponding FFmpeg source
        run: |
          test "$(uname -m)" = "$CPYMO_MAC_ARCH" || { echo "Host is not native $CPYMO_MAC_ARCH"; exit 1; }
          python -m pip install -r cpymo-tool/nds-converter/requirements-build.txt
          bash cpymo-tool/nds-converter/tools/build_ffmpeg_macos_lgpl.sh macos-ffmpeg-lgpl
          python - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'cpymo-tool/nds-converter')
          from video_nvl import validate_ffmpeg
          ffmpeg=Path('macos-ffmpeg-lgpl/bin/ffmpeg').resolve()
          validate_ffmpeg(str(ffmpeg))
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('NDS_FFMPEG='+str(ffmpeg)+'\n')
          PY
      - name: Build paired macOS .app using the exact VERIFIED ROM
        run: |
          python cpymo-backends/nds/tools/verify-release-artifact.py --rom .release-rom/cpymo-nds.nds
          python cpymo-tool/nds-converter/build_portable_macos.py --rom .release-rom/cpymo-nds.nds --ffmpeg "$NDS_FFMPEG" --target-arch "$CPYMO_MAC_ARCH" --output macos-rc --require-desktop-icon
          python cpymo-tool/nds-converter/tests/smoke_macos_portable.py --portable macos-rc --ffmpeg "$NDS_FFMPEG" --target-arch "$CPYMO_MAC_ARCH"
      - name: Package native macOS ARM64 distribution
        run: |
          folder="out/CPyMO-for-NDS-1.3.0-Starter-macOS-${CPYMO_MAC_ARCH}"
          mkdir -p "$folder/FFmpeg-Corresponding-Source"
          ditto macos-rc/CPyMO-NDS-Converter.app "$folder/CPyMO-NDS-Converter.app"
          cp macos-rc/cpymo-nds.nds macos-rc/VERSION.json macos-rc/README-macOS.txt macos-rc/ICON-MANIFEST.json "$folder/"
          # macOS ditto's ZIP entry name encoding can mangle Chinese basenames.
          # Keep Mac package filenames ASCII; contents remain UTF-8.
          cp cpymo-tool/nds-converter/README.md "$folder/Converter-README.md"
          cp cpymo-tool/nds-converter/assets/ICON-ATTRIBUTION.txt "$folder/ICON-ATTRIBUTION.txt"
          cp cpymo-tool/nds-converter/assets/PYMO-ORIGINAL-MIT-LICENSE.txt "$folder/PYMO-ORIGINAL-MIT-LICENSE.txt"
          test -s "$folder/ICON-ATTRIBUTION.txt" && test -s "$folder/PYMO-ORIGINAL-MIT-LICENSE.txt"
          cp -R macos-ffmpeg-lgpl/source/. "$folder/FFmpeg-Corresponding-Source/"
          cd out
          ditto -c -k --sequesterRsrc --keepParent "CPyMO-for-NDS-1.3.0-Starter-macOS-${CPYMO_MAC_ARCH}" "../CPyMO-for-NDS-1.3.0-Starter-macOS-${CPYMO_MAC_ARCH}.zip"
          cd ..
          python cpymo-backends/nds/tools/verify-release-artifact.py --rom .release-rom/cpymo-nds.nds --macos-starter "CPyMO-for-NDS-1.3.0-Starter-macOS-${CPYMO_MAC_ARCH}.zip"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.3.0-macOS-arm64-PAIRED-ROM
          path: CPyMO-for-NDS-1.3.0-Starter-macOS-arm64.zip
          retention-days: 21
          if-no-files-found: error

  source-rc:
    needs: [final-rom,converter-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Capture checked-out submodule code and full license tree
        run: |
          git submodule update --init stb endianness.h
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('.')
          name='CPyMO-for-NDS-1.3.0-Sources.zip'
          with zipfile.ZipFile(name,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or '.git' in p.parts or any(s in p.parts for s in ('node_modules','__pycache__','.pytest_cache')):
                      continue
                  if p==Path(name):continue
                  z.write(p, 'CPyMO-for-NDS-1.3.0-Sources/'+p.as_posix())
          print('Source tree ZIP',Path(name).stat().st_size)
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.3.0-SOURCES
          path: CPyMO-for-NDS-1.3.0-Sources.zip
          retention-days: 21
          if-no-files-found: error


  paired-asset-audit:
    needs: [final-rom, converter-regression, windows-rc, macos-rc, source-rc]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download all four distributions from the SAME workflow run
        uses: actions/download-artifact@v4
        with:
          pattern: CPyMO-1.3.0-*
          path: .paired-download
          merge-multiple: false
      - name: Audit real archives, ROM pairing, FFmpeg source, attribution and embedded icons
        run: |
          python -m pip install Pillow==12.3.0
          python cpymo-backends/nds/tools/audit-desktop-release.py \
            --rom ".paired-download/CPyMO-1.3.0-UNIVERSAL-VERIFIED-ROM/cpymo-nds.nds" \
            --windows ".paired-download/CPyMO-1.3.0-WINDOWS-PAIRED-ROM/CPyMO-for-NDS-1.3.0-Starter-Windows.zip" \
            --macos ".paired-download/CPyMO-1.3.0-macOS-arm64-PAIRED-ROM/CPyMO-for-NDS-1.3.0-Starter-macOS-arm64.zip" \
            --sources ".paired-download/CPyMO-1.3.0-SOURCES/CPyMO-for-NDS-1.3.0-Sources.zip" \
            --output release-paired-audit
          test -s release-paired-audit/CPyMO-for-NDS-1.3.0-SHA256SUMS.txt
          test -s release-paired-audit/RELEASE-PAIRED-AUDIT.json
      - name: Upload cross-platform release audit and SHA256SUMS
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.3.0-PAIRED-AUDIT-SHA256SUMS
          path: release-paired-audit/
          retention-days: 21
          if-no-files-found: error

