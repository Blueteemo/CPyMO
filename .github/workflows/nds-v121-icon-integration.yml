name: CPyMO 1.2.1 NDS Icon Integration (NO PUBLISH)
on:
  push:
    branches:
      - codex/nds-v1.2.1-release-candidate
    paths:
      - .github/workflows/nds-v121-icon-integration.yml
      - cpymo-backends/nds/assets/icon.bmp
      - cpymo-backends/nds/assets/icon.png
      - cpymo-backends/nds/source/app-icon.h
      - cpymo-tool/nds-converter/tests/test_nds_v121_icon.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  icon-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify 32px square art matches the native RGB555 launcher resource
        run: |
          python -m pip install Pillow
          PYTHONPATH=cpymo-tool/nds-converter/tests python -m unittest test_nds_v121_icon -v
  universal-rom:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Load dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init stb endianness.h
          dkp-pacman -Q devkitARM libnds libfat-nds maxmod-nds calico ndstool
      - name: Build native DS/DSi ROM with original square icon
        run: |
          python3 cpymo-backends/nds/tools/generate-ui-font.py
          python3 cpymo-backends/nds/build.py --dsi-experiment
          mkdir -p out-v121-icon
          python3 cpymo-backends/nds/tools/patch-rom-bg.py --rom cpymo-backends/nds/cpymo-dsi-experiment.nds --art cpymo-backends/nds/assets/nds-dual-bg.rgb555 --output out-v121-icon/cpymo-nds.nds
          python3 cpymo-backends/nds/tools/verify-release-artifact.py --rom out-v121-icon/cpymo-nds.nds --report out-v121-icon/ROM-VERIFICATION.json
          sha256sum out-v121-icon/cpymo-nds.nds > out-v121-icon/SHA256SUMS.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2.1-SQUARE-ICON-UNIVERSAL-ROM-CANDIDATE
          path: out-v121-icon/
          retention-days: 30
          if-no-files-found: error
