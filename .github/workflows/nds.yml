name: Nintendo DS
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/nds-*'
    paths:
      - 'cpymo/**'
      - 'cpymo-backends/include/**'
      - 'cpymo-backends/nds/**'
      - 'cpymo-tool/nds-converter/**'
      - '.github/workflows/nds.yml'
  pull_request:
    paths:
      - 'cpymo/**'
      - 'cpymo-backends/include/**'
      - 'cpymo-backends/nds/**'
      - 'cpymo-tool/nds-converter/**'
      - '.github/workflows/nds.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize required submodules
        run: git submodule update --init stb endianness.h
      - name: Install DS libraries and record SDK
        run: |
          dkp-pacman -Syu --noconfirm --needed libnds libfat-nds maxmod-nds calico ndstool
          dkp-pacman -Q devkitARM libnds libfat-nds maxmod-nds calico ndstool
      - name: Build original DS ROM
        run: python3 cpymo-backends/nds/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CPyMO-for-NDS
          path: cpymo-backends/nds/engine.nds
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r cpymo-tool/nds-converter/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s cpymo-tool/nds-converter/tests -v
