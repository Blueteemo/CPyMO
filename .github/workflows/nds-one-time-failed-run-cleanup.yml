name: CPyMO one-time failed run housekeeping
on:
  push:
    branches:
      - codex/nds-v1.2-integration
    paths:
      - .github/ci-requests/nds-prune-failed.txt
permissions:
  actions: write
  contents: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete exactly 14 reviewed historical failed runs, keep successes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.error,urllib.request
          expected="Blueteemo/CPyMO"
          repo=os.environ["GITHUB_REPOSITORY"]
          if repo!=expected:raise SystemExit("wrong repository")
          ids=[39864754395,39860446143,39860070976,39859370601,39857354387,39855221270,39847187854,39718806455,39712991211,39712531870,39701074340,39700918465,39700752879,39698194213]
          base="https://api.github.com/repos/"+repo+"/actions/runs/"
          token=os.environ["GITHUB_TOKEN"]
          def request(url,method="GET"):
              headers={"Accept":"application/vnd.github+json",
                       "Authorization":"Bearer "+token,
                       "X-GitHub-Api-Version":"2022-11-28",
                       "User-Agent":"cpymo-one-time-run-housekeeping"}
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method=method),timeout=25) as r:
                  return r.status,r.read()
          removed=[]
          for ident in ids:
              try:status,body=request(base+str(ident))
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      print("Already absent",ident,flush=True)
                      continue
                  raise
              run=json.loads(body)
              valid=(
                 run["id"]==ident and run["status"]=="completed" and
                 run["conclusion"]=="failure" and
                 run["head_branch"]=="codex/nds-v1.2-integration" and
                 "2026-10-22T00:00:00Z"<=run["created_at"]<"2026-10-23T00:00:00Z")
              if not valid:raise RuntimeError(f"Safety gate refused run {ident}: "+str({k:run.get(k) for k in ("status","conclusion","head_branch","created_at")}))
              print("DELETE failure:",ident,run["name"],run["created_at"],run["head_sha"],flush=True)
              code,_=request(base+str(ident),"DELETE")
              if code!=204:raise RuntimeError(f"Delete run {ident} returned {code}")
              removed.append(ident)
          print("DELETED RUN COUNT",len(removed),flush=True)
          print("SUCCESSFUL RUNS AND ALL OTHER BRANCHES WERE NOT TOUCHED.",flush=True)
          PY
