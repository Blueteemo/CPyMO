name: CPyMO 1.2 DSpico repair candidate
on:
  push:
    branches:
      - fix/nds-v1.2-pico-acceptance-20261027
  workflow_dispatch:
permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test save creation, screen routing and actual C canvas
        run: |
          python -m unittest discover -s cpymo-tool/nds-converter/tests -p 'test_nds_save_dir.py' -v
          python -m unittest discover -s cpymo-tool/nds-converter/tests -p 'test_nds_dual_canvas.py' -v
          python -m unittest discover -s cpymo-tool/nds-converter/tests -p 'test_nds_dual_layout.py' -v
          python -m unittest discover -s cpymo-tool/nds-converter/tests -p 'test_nds_display_machine.py' -v
          python -m unittest discover -s cpymo-tool/nds-converter/tests -p 'test_display_mode_prefs.py' -v
      - name: Preview actual C-rendered 256x192 lower canvas (not a game screenshot)
        run: |
          python cpymo-backends/nds/tools/nds-dual-canvas-preview.py --output dist/native-canvas
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-PICO-native-canvas-source-preview
          path: dist/native-canvas/*.png
          retention-days: 14
          if-no-files-found: error

  build-dspico-twl:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare checked-in SDK components
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init stb endianness.h
          dkp-pacman -Q devkitARM libnds libfat-nds maxmod-nds calico ndstool
      - name: Build DSpico TWL 16 MiB ROM
        run: |
          python3 cpymo-backends/nds/build.py --dsi-experiment
          test -s cpymo-backends/nds/cpymo-dsi-experiment.nds
      - name: Create non-destructive DSpico test handoff
        run: |
          mkdir -p dist/CPyMO_1.2_PICO_TWL_Fix_01-05
          cp cpymo-backends/nds/cpymo-dsi-experiment.nds dist/CPyMO_1.2_PICO_TWL_Fix_01-05/CPyMO_1.2_PICO_TWL_Fix_01-05.nds
          cat > dist/CPyMO_1.2_PICO_TWL_Fix_01-05/验收说明.txt <<'EOF'
          CPyMO 1.2 DSpico / DSi TWL 修复候选包，仅用于实机复验。
          只替换启动用的 .nds；继续使用此前《双卡回廊：终章验收》
          和 NVL1/NVA1/水仙2真实OP 的同一份游戏数据。
          请勿删除或覆盖任何既有游戏资源、存档目录及存档文件。
          确认运行时显示 DSi 模式 · 16 MiB。
          #01 在 L 三态循环中观察从下屏游戏切入增强双屏时是否闪辅助面板。
          #02 若未建立存档，首次 START 应自行创建 save/ 并保存槽位1；
              SELECT 读取并重新进入恢复验证。原有存档应保留。
          #03 经典辅助屏无临时消息时底行显示 DSi 模式 · 16 MiB；
              有保存/读取反馈时显示提示，结束后恢复常态。
          #04 X 设置菜单：文字速度、文字大小一字值居于 +/- 中间；
              检查其他音量选项、符号对齐和触控正常。
          #05 增强双屏下方为轻量RGB555深蓝面板，检查对白/菜单不受影响。
          仅需 DSpico 的实机复验；R4 已完成上一轮测试且无新问题。
          此为候选版，未确认实机通过，非公开发布版。
          EOF
          sha256sum dist/CPyMO_1.2_PICO_TWL_Fix_01-05/*.nds > dist/CPyMO_1.2_PICO_TWL_Fix_01-05/SHA256SUMS.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-PICO-TWL-FIX01-05-REVIEW-NOT-RELEASE
          path: dist/CPyMO_1.2_PICO_TWL_Fix_01-05/
          retention-days: 14
          if-no-files-found: error
