name: CPyMO 1.2 Final DSpico TWL and R4 NTR Stress
on:
  workflow_dispatch:
  push:
    branches:
      - codex/nds-v1.2-integration
    paths:
      - .github/ci-requests/nds-final.txt
permissions:
  contents: read

jobs:
  synthetic-stress-game:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install official converter dependencies
        run: python -m pip install -r cpymo-tool/nds-converter/requirements.txt
      - name: Resolve FFmpeg without requiring an unstable apt mirror
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            python -m pip install imageio-ffmpeg==0.6.0
            python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg
          link=Path(os.environ['RUNNER_TEMP'])/'ffmpeg'
          link.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ['GITHUB_PATH'],'a') as out:out.write(str(link.parent)+'\n')
          PY
          fi
      - name: Generate original 30MB artwork/music plus audiovisual film suite
        run: |
          python cpymo-tool/nds-converter/tests/make_release_stress_game.py /tmp/cpymo12stress --ffmpeg ffmpeg
      - name: Convert actual source game via public 1.2 NVL1 pipeline
        run: |
          mkdir -p pymo/games
          python cpymo-tool/nds-converter/convert.py convert /tmp/cpymo12stress pymo/games/CPYMO12_STRESS --ffmpeg ffmpeg --cache-only --audio-lossless voice --missing-glyph-policy box --video-mode nvl1 --video-fps 12
          python cpymo-tool/nds-converter/convert.py verify pymo/games/CPYMO12_STRESS
      - name: Verify meaningful size, four video manifests and source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('pymo/games/CPYMO12_STRESS')
          src=Path('/tmp/cpymo12stress')
          manifest=json.loads((root/'nds-cache/manifest.json').read_text())
          videos=manifest['videos']
          assert len(videos)==4, videos
          assert {item['name'] for item in videos}=={'OPENING','SKIPTEST','SILENT','LONGRUN'}
          assert all(item['format']=='NVL1' for item in videos)
          assert not manifest['audit']['unsupported_video_commands'],manifest['audit']
          assert not manifest['audit']['unknown_commands'],manifest['audit']
          assert not manifest['audit']['missing_resource_references'],manifest['audit']
          assert (root/'script/START.txt').read_bytes()==(src/'script/START.txt').read_bytes()
          assert not (root/'video').exists(), 'Source video should be cache-only'
          assert not (root/'save').joinpath('existing.csav').exists()
          total=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          assert 28*1024*1024<=total<=160*1024*1024,total
          assert len(list((root/'nds-cache/video').rglob('*.nvl')))==4
          audit={'converted_game_bytes':total,'MiB':round(total/1048576,2),
                 'videos':[{'name':x['name'],'format':x['format'],
                            'frames':x['frames'],'bytes':x['bytes']} for x in videos],
                 'original_script_sha256':hashlib.sha256((src/'script/START.txt').read_bytes()).hexdigest(),
                 'converted_script_sha256':hashlib.sha256((root/'script/START.txt').read_bytes()).hexdigest(),
                 'unknown_commands':0,'missing_assets':0}
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          (root/'STRESS_ACCEPTANCE.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Upload SAME immutable game cache for both flashcards
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-SHARED-FINAL-STRESS-GAME
          path: pymo/
          if-no-files-found: error
          retention-days: 30

  dual-roms:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Initialize required submodules and verify SDK
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init stb endianness.h
          dkp-pacman -Q devkitARM libnds libfat-nds maxmod-nds calico ndstool
      - name: Compile NTR 4 MiB and TWL 16 MiB ROMs
        run: |
          python3 cpymo-backends/nds/build.py
          python3 cpymo-backends/nds/build.py --dsi-experiment
          python3 - <<'PY'
          from pathlib import Path
          n=Path('cpymo-backends/nds/engine.nds')
          t=Path('cpymo-backends/nds/cpymo-dsi-experiment.nds')
          assert n.read_bytes()[0x12] in (0,1), 'NTR ROM header invalid'
          assert t.read_bytes()[0x12]==2,'TWL ROM header invalid'
          print('NTR ROM bytes:',n.stat().st_size)
          print('TWL ROM bytes:',t.stat().st_size)
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-NTR-AND-TWL-ROM
          path: |
            cpymo-backends/nds/engine.nds
            cpymo-backends/nds/cpymo-dsi-experiment.nds
          if-no-files-found: error
          retention-days: 30

  integrated-package:
    needs: [synthetic-stress-game, dual-roms]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CPyMO-1.2-SHARED-FINAL-STRESS-GAME
          path: source-game
      - uses: actions/download-artifact@v4
        with:
          name: CPyMO-1.2-NTR-AND-TWL-ROM
          path: source-roms
      - name: Combine identical stress game with separately labeled ROMs
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil,zipfile
          from pathlib import Path
          root=Path('out/CPyMO_1.2_双卡综合验收')
          game=Path('source-game/games/CPYMO12_STRESS')
          if not game.is_dir():game=Path('source-game/pymo/games/CPYMO12_STRESS')
          assert (game/'nds-cache/manifest.json').is_file(), game
          roms=list(Path('source-roms').rglob('*.nds'))
          assert len(roms)==2,[str(x) for x in roms]
          ntr=next(x for x in roms if x.name=='engine.nds')
          twl=next(x for x in roms if x.name=='cpymo-dsi-experiment.nds')
          assert twl.read_bytes()[0x12]==2
          assert ntr.read_bytes()[0x12] in (0,1)
          shutil.copytree(game,root/'pymo/games/CPYMO12_STRESS')
          for src,dst in [
              (ntr,root/'ROM/R4_DS_NTR/CPyMO_1.2_NTR.nds'),
              (twl,root/'ROM/DSpico_DSi_TWL/CPyMO_1.2_TWL.nds')]:
              dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          guide="""CPyMO 1.2 发布前双卡综合验收 — 开发版，非正式发行
          游戏：双卡回廊：终章验收。原创资源、非商业游戏，包含 12 幕背景、4 组人物、8 首长 BGM、音效/语音，以及四段视频。
          
          ① DSpico 标准版：使用 ROM/DSpico_DSi_TWL/CPyMO_1.2_TWL.nds
             在你的 DSi/TWL 能正常启动的路径放 ROM，游戏放到该启动器实际读取的
             sd:/pymo/games/CPYMO12_STRESS 或 fat:/pymo/games/CPYMO12_STRESS。
             启动页/关于须显示「DSi 模式 · 16 MiB」。若显示 DS 模式，
             则这次启动不算 TWL 实机验证，请检查 Loader 运行模式。
          ② R4：使用 ROM/R4_DS_NTR/CPyMO_1.2_NTR.nds
             在 R4 卡的 fat:/pymo/games/CPYMO12_STRESS 放置相同的游戏目录。
             启动页/关于须显示「DS 模式 · 4 MiB」。
          ③ 两卡依次测试完整标题选单（第三态开始时不拆分）、12 幕剧情切换、
             人物透明遮罩、长音乐、BGM/SE/VO、剧情分支及触控。
             再验证视频一正常结束；视频二运行中按 B 跳过；视频三无源音轨；
             视频四 24 秒连续播放。每段返回后均确认对白/BGM继续。
          ④ 依次用 L 轮换「上屏游戏/下屏游戏/增强双屏」，Y 辅助屏开关；
             X 打开菜单，检查时钟。START 快速保存、SELECT 快速读取（槽位1）。
             再返回主画面/重新启动，确认存档有效。
          ⑤ 检查持续运行、重复启动、画面闪烁、音画同步和读卡等待。
             请分别记录两种模式，不要以 DSpico 的流畅度代替 R4 的结论。
          
          安全事项：
          - 绝不要用测试包里的 save 目录覆盖已有存档。此测试游戏有独立目录。
          - 如果同一台机器插着两张卡，请确保 ROM 与 pymo/games 的路径一致；
            不要因为看到另一张卡上的游戏就误判正在测试的读卡通路。
          - 发布前还需实机验收、Windows GUI及第三方许可证材料复核。
          - 本包只提供 ROM 和原创合成游戏，不附烧录卡内核/第三方游戏。
          """
          (root/'双卡验收说明.txt').write_text('\n'.join(x.lstrip(' ') for x in guide.splitlines()),encoding='utf-8-sig')
          entries={}
          for f in sorted(root.rglob('*')):
              if f.is_file():entries[f.relative_to(root).as_posix()]=hashlib.sha256(f.read_bytes()).hexdigest()
          (root/'SHA256SUMS.txt').write_text(''.join(f'{sha}  {name}\n' for name,sha in entries.items()))
          output=Path('out/CPyMO_1.2_DSpico_TWL_R4_NTR_终章综合验收.zip')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in root.rglob('*'):
                  if f.is_file():z.write(f,f.relative_to(root.parent))
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
          print(json.dumps({'archive':str(output),'bytes':output.stat().st_size,
                            'files':len(entries),'roms':{p.name:p.stat().st_size for p in roms}},
                            ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CPyMO-1.2-DSpico-TWL-R4-NTR-FINAL-STRESS-REVIEW
          path: out/CPyMO_1.2_DSpico_TWL_R4_NTR_终章综合验收.zip
          if-no-files-found: error
          retention-days: 30
